name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Install Gradle 6.7.1
      run: |
        wget https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
        unzip gradle-6.7.1-bin.zip
        export PATH=$PATH:$PWD/gradle-6.7.1/bin
        gradle -v
    - name: Build with Gradle
      run: ./gradle-6.7.1/bin/gradle assembleDebug > build.log 2>&1
      
    - name: Upload Build Log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: build.log

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-apks
        path: app/build/outputs/apk/**/*.apk
